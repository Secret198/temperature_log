<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Analytics & Forecast Dashboard</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='icon.svg') }}">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Controls Section */
        .controls-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 9px 18px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: #f1f5f9;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        .dropdown-filters {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        select, button.action-btn {
            padding: 9px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #ffffff;
            font-size: 14px;
            color: var(--text-color);
            outline: none;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        button.action-btn {
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.apply-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
        }

        button.apply-btn:hover {
            background-color: var(--primary-hover);
        }

        button.reset-btn {
            background-color: var(--danger-color);
            color: #ffffff;
            border: none;
        }

        button.reset-btn:hover {
            background-color: var(--danger-hover);
        }

        /* Side-by-Side Charts Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .chart-card-header {
            margin-bottom: 16px;
        }

        .chart-card-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
        }

        .chart-card-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Temperature Analytics Dashboard</h1>
        <p>Monitor real-time historical fluctuations and view SARIMAX model predictions side-by-side.</p>
    </div>

    <!-- Filter Controls Card -->
    <div class="controls-card">
        <!-- Preset Range Controls -->
        <div class="preset-buttons">
            <button onclick="setActiveButton('btn-24h'); window.location.href = '/'" class="filter-btn active" id="btn-24h">Last 24 Hours</button>
            <button onclick="setActiveButton('btn-week'); updateChartData('/last_week')" class="filter-btn" id="btn-week">Last 7 Days</button>
            <button onclick="setActiveButton('btn-month'); updateChartData('/last_month')" class="filter-btn" id="btn-month">Last Month</button>
            <button onclick="setActiveButton('btn-year'); updateChartData('/last_year')" class="filter-btn" id="btn-year">Last Year</button>
            <button onclick="setActiveButton('btn-all'); updateChartData('/yearly')" class="filter-btn" id="btn-all">All Records</button>
        </div>

        <!-- Date Selectors -->
        <div class="dropdown-filters">
            <select id="yearFilter">
                <option value="">Select Year</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
            </select>

            <select id="monthFilter">
                <option value="">All Months</option>
                <option value="01">January</option>
                <option value="02">February</option>
                <option value="03">March</option>
                <option value="04">April</option>
                <option value="05">May</option>
                <option value="06">June</option>
                <option value="07">July</option>
                <option value="08">August</option>
                <option value="09">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>

            <select id="dayFilter">
                <option value="">All Days</option>
            </select>

            <button class="action-btn apply-btn" onclick="applyFilters()">Apply Filters</button>
            <button class="action-btn reset-btn" onclick="window.location.href='/'">Reset</button>
        </div>
    </div>

    <!-- Charts Container Grid -->
    <div class="dashboard-grid">
        <!-- Chart 1: Historical Data -->
        <div class="chart-card">
            <div class="chart-card-header">
                <h2>Historical Temperature Fluctuations</h2>
                <p>Observed temperature records over time</p>
            </div>
            <div class="chart-wrapper">
                <canvas id="historyChart"></canvas>
            </div>
        </div>

        <!-- Chart 2: ARIMA Forecast -->
        <div class="chart-card">
            <div class="chart-card-header">
                <h2>ARIMA Temperature Forecast</h2>
                <p>24-hour prediction mean with upper & lower confidence interval</p>
            </div>
            <div class="chart-wrapper">
                <canvas id="forecastChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const rawHistoryData = [
            {% for t in temperatures %}
                { 
                    temperature: {{ t.temperature }},
                    timestamp: "{{ t.timestamp }}" 
                },
            {% endfor %}
        ];

        // ARIMA Forecast predictions passed from Flask
        const rawForecastData = [
            {% for f in forecast_data %}
                {
                    timestamp: "{{ f.timestamp }}",
                    temperature: {{ f.temperature }},
                    lower: {{ f.lower_bound }},
                    upper: {{ f.upper_bound }}
                },
            {% endfor %}
        ];

        let historyChart;
        let forecastChart;

        function initCharts(historyData, forecastData) {
            const ctxHistory = document.getElementById('historyChart').getContext('2d');
            historyChart = new Chart(ctxHistory, {
                type: 'line',
                data: {
                    labels: historyData.map(item => item.timestamp),
                    datasets: [{
                        label: 'Historical (°C)',
                        data: historyData.map(item => item.temperature),
                        borderColor: '#ff4757',
                        backgroundColor: 'rgba(255, 71, 87, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: 'Timestamp' } },
                        y: { title: { display: true, text: 'Temperature (°C)' } }
                    }
                }
            });

            const ctxForecast = document.getElementById('forecastChart').getContext('2d');
            forecastChart = new Chart(ctxForecast, {
                type: 'line',
                data: {
                    labels: forecastData.map(item => item.timestamp),
                    datasets: [
                        {
                            label: 'Predicted Mean (°C)',
                            data: forecastData.map(item => item.temperature),
                            borderColor: '#2563eb',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            borderDash: [6, 6],
                            tension: 0.3,
                            pointRadius: 4,
                            pointBackgroundColor: '#2563eb'
                        },
                        {
                            label: 'Upper Bound',
                            data: forecastData.map(item => item.upper),
                            borderColor: 'rgba(37, 99, 235, 0.3)',
                            borderWidth: 1,
                            pointRadius: 0,
                            fill: '+1', // Fill space down to Lower Bound
                            backgroundColor: 'rgba(37, 99, 235, 0.15)'
                        },
                        {
                            label: 'Lower Bound',
                            data: forecastData.map(item => item.lower),
                            borderColor: 'rgba(37, 99, 235, 0.3)',
                            borderWidth: 1,
                            pointRadius: 0,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                // Hide bounds from legend to keep UI clean
                                filter: item => item.text !== 'Upper Bound' && item.text !== 'Lower Bound'
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Forecast Timestamp' } },
                        y: { title: { display: true, text: 'Temperature (°C)' } }
                    }
                }
            });
        }

        function setupDayDropdown() {
            const daySelect = document.getElementById('dayFilter');
            for (let i = 1; i <= 31; i++) {
                const dayVal = String(i).padStart(2, '0');
                daySelect.innerHTML += `<option value="${dayVal}">${i}</option>`;
            }
        }

        function setActiveButton(activeBtnId) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            const selectedBtn = document.getElementById(activeBtnId);
            if (selectedBtn) {
                selectedBtn.classList.add('active');
            }
        }

        async function updateChartData(endpoint) {
            try {
                const response = await fetch(endpoint);
                const data = await response.json();

                historyChart.data.labels = data.map(item => item.timestamp);
                historyChart.data.datasets[0].data = data.map(item => item.temperature);
                historyChart.update();
            } catch (error) {
                console.error("Error fetching temperature data:", error);
            }
        }

        function applyFilters() {
            const year = document.getElementById('yearFilter').value;
            const month = document.getElementById('monthFilter').value;
            const day = document.getElementById('dayFilter').value;

            if (!year) {
                alert("Please select at least a year!");
                return;
            }
            let url = "/ev";
            let dateStr = year;
            if (month) {
                dateStr += `-${month}`;
                url += "/honap";
            } 
            if (day) {
                dateStr += `-${day}`;
                url += "/nap";
            }

            updateChartData(`${url}/${dateStr}`);
        }

        initCharts(rawHistoryData, rawForecastData);
        setupDayDropdown();
    </script>
</body>
</html>
