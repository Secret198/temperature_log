<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Dashboard</title>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            color: #1f2937;
            display: inline-block;
            transition: all 0.2s ease;
        }
        .filter-btn:hover {
            background: #f3f4f6;
        }
        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 750px;
            height: 400px;
            margin-bottom: 20px;
        }
        .filter-container {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        select, button {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: white;
            font-size: 14px;
        }
        button.apply-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        button.apply-btn:hover {
            background-color: #1d4ed8;
        }
        button.reset-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            cursor: pointer;
        }
        button.reset-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>
    <h1>Hőmérséklet ingadozások</h1>

    <div class="controls">
        <button onclick=" setActiveButton('btn-24h'); window.location.href = '/'" class="filter-btn active" id="btn-24h">Legutóbbi 24 óra</button>
        <button onclick="setActiveButton('btn-week'); updateChartData('/last_week')" class="filter-btn" id="btn-week">Legutóbbi 7 nap</button>
        <button onclick="setActiveButton('btn-month'); updateChartData('/last_month')" class="filter-btn" id="btn-month">Legutóbbi hónap</button>
        <button onclick="setActiveButton('btn-year'); updateChartData('/last_year')" class="filter-btn" id="btn-year">Legutóbbi év</button>
        <button onclick="setActiveButton('btn-all'); updateChartData('/yearly')" class="filter-btn" id="btn-all">Összes</button>
    </div>


    <!-- Canvas for Chart.js -->
    <div class="chart-container">
        <canvas id="tempChart"></canvas>
    </div>

    <!-- Date Dropdown Navigation -->
    <div class="filter-container">
        <select id="yearFilter">
            <option value="">Válassz évet</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
        </select>

        <select id="monthFilter">
            <option value="">Minden hónap</option>
            <option value="01">Január</option>
            <option value="02">Február</option>
            <option value="03">Március</option>
            <option value="04">Április</option>
            <option value="05">Május</option>
            <option value="06">Június</option>
            <option value="07">Július</option>
            <option value="08">Augusztus</option>
            <option value="09">Szeptember</option>
            <option value="10">Október</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>

        <select id="dayFilter">
            <option value="">Minden nap</option>
        </select>

        <button class="apply-btn" onclick="applyFilters()">Szűrés</button>
        <button class="reset-btn" onclick="window.location.href='/'">Szűrők törlése</button>
    </div>

    <script>
        const rawData = [
            {% for t in temperatures %}
                { 
                    temperature: {{ t.temperature }},
                    timestamp: "{{ t.timestamp }}" 
                },
            {% endfor %}
        ];

        let tempChart;

        function initChart(data) {
            const ctx = document.getElementById('tempChart').getContext('2d');
            
            tempChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(item => item.timestamp),
                    datasets: [{
                        label: 'Hőmérséklet (°C)',
                        data: data.map(item => item.temperature),
                        borderColor: '#ff4757',
                        backgroundColor: 'rgba(255, 71, 87, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: 'Időpont / Dátum' } },
                        y: { title: { display: true, text: 'Hőmérséklet (°C)' } }
                    }
                }
            });
        }

        // Dynamically populate days dropdown (01 to 31)
        function setupDayDropdown() {
            const daySelect = document.getElementById('dayFilter');
            for (let i = 1; i <= 31; i++) {
                const dayVal = String(i).padStart(2, '0');
                daySelect.innerHTML += `<option value="${dayVal}">${i}</option>`;
            }
        }

        // function setActiveButton(btn) {
        //     // const path = window.location.pathname;
        //     // if (path === '/') document.getElementById('btn-24h').classList.add('active');
        //     // else if (path === '/last_week') document.getElementById('btn-week').classList.add('active');
        //     // else if (path === '/last_month') document.getElementById('btn-month').classList.add('active');
        //     // else if (path === '/last_year') document.getElementById('btn-year').classList.add('active');
        //     // else if (path === '/all') document.getElementById('btn-all').classList.add('active');
        //     document.getElementById(btn).classList.add('active')
        // }

        // Highlight active preset button and remove highlight from others
        function setActiveButton(activeBtnId) {
            // 1. Remove active class from all filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // 2. Add active class to the clicked button
            const selectedBtn = document.getElementById(activeBtnId);
            if (selectedBtn) {
                selectedBtn.classList.add('active');
            }
        }

        // function applyFilters() {
        //     const year = document.getElementById('yearFilter').value;
        //     const month = document.getElementById('monthFilter').value;
        //     const day = document.getElementById('dayFilter').value;

        //     if (!year) {
        //         alert("Kérjük, válassz legalább egy évet!");
        //         return;
        //     }

        //     if (year && month && day) {
        //         // Calls @app.route("/ev/<year_month_day>")
        //         window.location.href = `/ev/${year}-${month}-${day}`;
        //     } else if (year && month) {
        //         // Calls @app.route("/ev/<year_month>")
        //         window.location.href = `/ev/honap/${year}-${month}`;
        //     } else if (year) {
        //         // Calls @app.route("/ev/<year>")
        //         window.location.href = `/ev/honap/nap/${year}`;
        //     }

            
        // }

        async function updateChartData(endpoint) {
            try {
                const response = await fetch(endpoint);
                const data = await response.json();

                // Update Chart.js labels and dataset
                tempChart.data.labels = data.map(item => item.timestamp);
                tempChart.data.datasets[0].data = data.map(item => item.temperature);
                
                // Trigger Chart.js smooth re-render animation
                tempChart.update();
            } catch (error) {
                console.error("Error fetching temperature data:", error);
            }
        }

        function applyFilters() {
            const year = document.getElementById('yearFilter').value;
            const month = document.getElementById('monthFilter').value;
            const day = document.getElementById('dayFilter').value;

            if (!year) {
                alert("Kérjük, válassz legalább egy évet!");
                return;
            }
            let url = "/ev"
            let dateStr = year;
            if (month){
                dateStr += `-${month}`;
                url += "/honap"
            } 
            if (day){
                dateStr += `-${day}`;
                url += "/nap"
            }

            updateChartData(`${url}/${dateStr}`);
        }

        function loadPreset(preset) {
            if (preset === '24h') updateChartData('/api/data');
            else if (preset === 'week') updateChartData('/api/data/last_week');
        }

        initChart(rawData);
        setupDayDropdown();
    </script>
</body>
</html>
