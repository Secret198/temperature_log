<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ code }} - {{ title }}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='icon.svg') }}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 48px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
        }

        /* Dynamic Status Code Display */
        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: #ef4444;
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .error-message {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-home {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-code">{{ code }}</div>
        
        <h1 class="error-title">Error: {{ code }} ({{ title }})</h1>
        
        <p class="error-message">{{ description }}</p>

        <a href="/" class="btn-home">Back to the main page</a>
    </div>

</body>
</html>
